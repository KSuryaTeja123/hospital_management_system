databases:
  - name: hospital-mgmt-db
    plan: free
    databaseName: hospital_mgmt
    user: hospital_mgmt_user

services:
  - type: web
    name: hospital-mgmt-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-mgmt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hospital-mgmt-client.onrender.com
      - key: PORT
        value: 4001

  - type: web
    name: hospital-mgmt-client
    runtime: static
    rootDir: client
    buildCommand: ""
    staticPublishPath: .
